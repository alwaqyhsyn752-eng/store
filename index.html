<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>متجر النخبة | Midnight Luxe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-atmosphere"></div>

<header class="app-header">
  <div class="header-top">
    <div class="brand">
      <span class="brand-mark">E</span>
      <div class="brand-text">
        <span class="brand-name" id="storeName">متجر النخبة</span>
        <span class="brand-tag">Midnight Luxe</span>
      </div>
    </div>
    <a href="cart.html" class="cart-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartCount">0</span>
    </a>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="searchInput" placeholder="ابحث عن الفخامة..." autocomplete="off">
  </div>
</header>

<nav class="categories-nav" id="categoriesNav"></nav>

<main class="app-main">
  <section class="banner-section">
    <div class="banner-slider">
      <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" class="banner-img" alt="Luxury Background">
      <div class="banner-overlay"></div>
      <div class="banner-content">
        <span class="banner-subtitle">مجموعة 2024</span>
        <h1 class="banner-title">أناقة لا تُضاهى</h1>
        <button class="banner-btn">اكتشف الآن</button>
      </div>
    </div>
  </section>

  <section class="products-section">
    <header class="section-head">
      <h2>منتجات مختارة</h2>
      <span class="section-line"></span>
    </header>
    <div class="products-grid" id="productsGrid"></div>
  </section>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item active">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>الرئيسية</span>
  </a>
  <a href="cart.html" class="nav-item">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span>السلة</span>
  </a>
  <button class="nav-item" id="accountBtn">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>حسابي</span>
  </button>
</nav>

<div class="modal-overlay" id="productModal"><div class="modal-content" id="productModalContent"></div></div>
<div class="modal-overlay" id="authModal"><div class="modal-content" id="authModalContent"></div></div>
<div class="toast" id="toast"></div>

<script src="js/database.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
</body>
</html>
