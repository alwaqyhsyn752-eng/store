<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIR | متجر النخبة</title>
<style>
:root{--black:#101722;--navy:#1B2938;--gold:#C6A66A;--gold2:#b59559;--ivory:#F1EBDD;--emerald:#527D70;--gray:#A5ABB4;--line:rgba(198,166,106,0.18);--card:rgba(27,41,56,0.55)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;background:#0a1018;background-image:radial-gradient(circle at 50% 0%,#1B2938 0%,#101722 55%,#0a1018 100%);background-attachment:fixed;color:var(--ivory);direction:rtl;min-height:100vh;padding-bottom:80px;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{text-decoration:none;color:inherit}
input::placeholder,textarea::placeholder{color:var(--gray)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.hidden{display:none !important}
.gold{color:var(--gold)}
.header{position:sticky;top:0;z-index:100;background:rgba(16,23,34,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--black);box-shadow:0 4px 14px rgba(198,166,106,0.35);flex-shrink:0}
.brand-name{font-size:16px;font-weight:800;color:var(--ivory);display:block;letter-spacing:0.5px}
.brand-tag{font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
.hdr-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:11px;background:rgba(198,166,106,0.08);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);position:relative;transition:all .25s}
.icon-btn:hover{background:rgba(198,166,106,0.18)}
.icon-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--gold);color:var(--black);font-size:10px;font-weight:800;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.search{position:relative}
.search input{width:100%;height:44px;background:rgba(16,23,34,0.7);border:1px solid var(--line);border-radius:11px;padding:0 42px 0 14px;color:var(--ivory);font-size:14px;transition:all .25s}
.search input:focus{outline:none;border-color:var(--gold);background:rgba(16,23,34,0.95);box-shadow:0 0 0 3px rgba(198,166,106,0.1)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold);pointer-events:none}
.cats{padding:14px 16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);background:rgba(16,23,34,0.35);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;background:rgba(27,41,56,0.6);border:1px solid var(--line);border-radius:12px;margin-left:8px;font-size:12px;font-weight:500;color:var(--gray);transition:all .25s;min-width:74px}
.cat.active{background:var(--gold);color:var(--black);border-color:var(--gold);font-weight:700}
.cat svg{width:22px;height:22px}
main{padding:0}
.hero{margin:16px;border-radius:20px;overflow:hidden;position:relative;height:240px;border:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to left,rgba(16,23,34,0.95) 0%,rgba(16,23,34,0.4) 60%,rgba(16,23,34,0.1) 100%)}
.hero-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px}
.hero-tag{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:8px;font-weight:700}
.hero-title{font-size:30px;font-weight:900;color:var(--ivory);margin-bottom:14px;line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
.hero-btn{background:var(--gold);color:var(--black);padding:11px 24px;border-radius:24px;font-weight:800;font-size:13px;width:fit-content;transition:all .25s}
.hero-btn:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(198,166,106,0.4)}
.section-head{padding:24px 16px 14px;display:flex;align-items:center;gap:14px}
.section-head h2{font-size:19px;font-weight:800;color:var(--ivory);white-space:nowrap}
.section-head .line{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr);padding:0 32px;gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .35s cubic-bezier(.175,.885,.32,1.275);display:flex;flex-direction:column;backdrop-filter:blur(10px)}
.card:hover{transform:translateY(-6px);box-shadow:0 15px 35px rgba(0,0,0,0.5),0 0 0 1px var(--gold)}
.card-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--black)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.08)}
.badge{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:800;letter-spacing:.5px}
.badge.new{background:var(--ivory);color:var(--black)}
.badge.offer{background:var(--emerald);color:var(--ivory)}
.badge.out{background:rgba(231,76,60,0.95);color:#fff;top:auto;bottom:8px;right:8px}
.card-info{padding:12px;display:flex;flex-direction:column;flex:1;gap:4px}
.card-name{font-size:13px;font-weight:700;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card-price{display:flex;align-items:baseline;gap:6px;margin:2px 0 6px}
.price-now{color:var(--gold);font-size:15px;font-weight:800}
.price-old{color:var(--gray);font-size:11px;text-decoration:line-through}
.card-btn{margin-top:auto;padding:9px;background:transparent;border:1px solid var(--gold);border-radius:9px;color:var(--gold);font-weight:700;font-size:12px;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:5px}
.card-btn:hover{background:var(--gold);color:var(--black)}
.card-btn:disabled{opacity:.35;cursor:not-allowed;background:transparent;color:var(--gray);border-color:var(--gray)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,23,34,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--gray);padding:4px 16px;background:none;transition:all .25s;font-weight:500}
.nav-item svg{width:22px;height:22px;transition:transform .25s}
.nav-item.active{color:var(--gold);font-weight:700}
.nav-item.active svg{transform:translateY(-2px)}
</style>
</head>
<body>


<!-- شريط الحالة العلوي -->
<div class="status-bar" id="statusBar">
  <h4 id="statusTitle">جاري المعالجة...</h4>
  <p id="statusMsg"></p>
</div>

<!-- ============ صفحة المتجر ============ -->
<div class="page active" id="pageStore">
  <header class="header">
    <div class="header-top">
      <div class="brand" onclick="App.go('store')">
        <div class="brand-mark">N</div>
        <div>
          <span class="brand-name" id="brandName">NOIR</span>
          <span class="brand-tag">Premium Market</span>
        </div>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn" onclick="Store.openCart()" title="السلة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
        <button class="icon-btn" onclick="App.go('account')" title="حسابي">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="ابحث عن الفخامة..." oninput="Store.filter()">
    </div>
  </header>

  <nav class="cats" id="catsNav"></nav>

  <section class="hero">
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=900&q=80" alt="NOIR Hero" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,#1B2938,#101722)'">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-tag">مجموعة 2025</div>
      <h1 class="hero-title">أناقة لا تُضاهى</h1>
      <button class="hero-btn" onclick="document.getElementById('productsGrid').scrollIntoView({behavior:'smooth'})">اكتشف الآن →</button>
    </div>
  </section>

  <div class="section-head"><h2>المنتجات المميزة</h2><div class="line"></div></div>
  <div class="grid" id="productsGrid"></div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="App.go('store')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>المتجر</span>
    </button>
    <button class="nav-item" onclick="Store.openCart()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>السلة</span>
    </button>
    <button class="nav-item" onclick="App.go('account')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>حسابي</span>
    </button>
    
  </nav>
</div>

<!-- ============ صفحة الحساب ============ -->
<div class="page" id="pageAccount">
  <header class="header">
    <div class="header-top">
      <div class="brand" onclick="App.go('store')">
        <div class="brand-mark">N</div>
        <div><span class="brand-name">حسابي</span><span class="brand-tag">Account</span></div>
      </div>
      <button class="icon-btn" onclick="App.go('store')">✕</button>
    </div>
  </header>
  <div id="accountContent" style="padding:16px"></div>
</div>

<!-- ============ Modal: تفاصيل المنتج ============ -->
<div class="modal" id="productModal" onclick="if(event.target===this)Store.closeProduct()">
  <div class="modal-box" id="productModalBox"></div>
</div>

<!-- ============ Modal: السلة ============ -->
<div class="modal" id="cartModal" onclick="if(event.target===this)Store.closeCart()">
  <div class="modal-box" id="cartBox"></div>
</div>

<!-- ============ Modal: عام (تسجيل/إتمام طلب/نموذج منتج) ============ -->
<div class="modal" id="genericModal" onclick="if(event.target===this)App.closeModal()">
  <div class="modal-box" id="genericBox"></div>
</div>

<div class="toast" id="toast"></div>


<script>

// ==================== قاعدة البيانات (localStorage) ====================
const DB = {
  get(k, def) { try { const v = localStorage.getItem('noir_'+k); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(k, v) { localStorage.setItem('noir_'+k, JSON.stringify(v)); },
  del(k) { localStorage.removeItem('noir_'+k); }
};

// ==================== البيانات الافتراضية ====================
function seedIfEmpty() {
  if (!DB.get('products')) {
    const defs = [
      {id:'p1',name:'ساعة فاخرة كلاسيك',price:1299,oldPrice:1599,cat:'watches',stock:12,status:'offer',rating:4.9,desc:'ساعة سويسرية بسوار جلد إيطالي أصلي، حركة كوارتز يابانية، مقاومة للماء 50 متر.',images:[svgImg('WATCH 1','#1B2938','#C6A66A'),svgImg('WATCH 2','#101722','#C6A66A')]},
      {id:'p2',name:'عطر NOIR Signature',price:599,oldPrice:null,cat:'perfumes',stock:25,status:'new',rating:4.8,desc:'عطر شرقي فاخر بمزيج من العود والمسك والعنبر. ثبات يدوم 12 ساعة.',images:[svgImg('NOIR','#101722','#C6A66A')]},
      {id:'p3',name:'حقيبة جلد فاخرة',price:899,oldPrice:1199,cat:'bags',stock:8,status:'offer',rating:4.7,desc:'حقيبة يد جلد طبيعي، تصميم عصري، مساحة واسعة، أحزمة قابلة للتعديل.',images:[svgImg('BAG','#1B2938','#C6A66A')]},
      {id:'p4',name:'نظارة شمسية برو',price:459,oldPrice:null,cat:'accessories',stock:30,status:'new',rating:4.6,desc:'نظارة شمسية بإطار معدني خفيف وعدسات مضادة للأشعة فوق البنفسجية.',images:[svgImg('SUNGLASSES','#101722','#C6A66A')]},
      {id:'p5',name:'محفظة جلد رجالية',price:249,oldPrice:349,cat:'bags',stock:40,status:'offer',rating:4.5,desc:'محفظة جلد طبيعي بحجم صغير، تصميم كلاسيكي أنيق مع 8 جيوب للبطاقات.',images:[svgImg('WALLET','#1B2938','#C6A66A')]},
      {id:'p6',name:'قلم فاخر ذهبي',price:189,oldPrice:null,cat:'accessories',stock:15,status:'normal',rating:4.4,desc:'قلم حبر فاخر بطلاء ذهبي، تصميم كلاسيكي مناسب للهدايا الرسمية.',images:[svgImg('PEN','#101722','#C6A66A')]}
    ];
    DB.set('products', defs);
  }
  if (!DB.get('categories')) {
    DB.set('categories', [
      {id:'all',name:'الكل',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>'},
      {id:'watches',name:'ساعات',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="6"/><path d="M9 2h6l-1 4"/><path d="M9 22h6l-1-4"/></svg>'},
      {id:'perfumes',name:'عطور',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="9" width="10" height="12" rx="2"/><path d="M9 9V6a3 3 0 0 1 3-3 3 3 0 0 1 3 3v3"/></svg>'},
      {id:'bags',name:'حقائب',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.5 12H5.5L4 8z"/><path d="M9 8V5a3 3 0 0 1 6 0v3"/></svg>'},
      {id:'accessories',name:'إكسسوارات',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="12" r="3"/><circle cx="16" cy="12" r="3"/><path d="M11 12h2"/></svg>'}
    ]);
  }
  if (!DB.get('settings')) {
    DB.set('settings', {storeName:'NOIR',currency:'ر.س',adminPass:'1234'});
  }
}

function svgImg(txt, bg, color) {
  const s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="'+(bg||'#1B2938')+'"/><stop offset="100%" stop-color="#0a1018"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><text x="200" y="270" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="'+(color||'#C6A66A')+'" opacity="0.9">'+txt+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}

// ==================== أدوات ====================
const $ = id => document.getElementById(id);
function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = 'toast'; }, 2800);
}

// ==================== App Router ====================
const App = {
  go(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const el = $('page' + (page.charAt(0).toUpperCase() + page.slice(1)));
    if (el) el.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    window.scrollTo(0,0);
    if (page === 'account') Accounts.render();
    
    if (page === 'store') Store.render();
  },
  closeModal() { $('genericModal').classList.remove('open'); },
  showModal(html) { $('genericBox').innerHTML = html; $('genericModal').classList.add('open'); }
};

// ==================== Store ====================
const Store = {
  activeCat: 'all',
  searchQuery: '',
  currentImages: [],
  currentImgIdx: 0,

  render() {
    $('brandName').textContent = DB.get('settings',{}).storeName || 'NOIR';
    this.renderCats();
    this.renderProducts();
    this.updateBadge();
  },

  renderCats() {
    const cats = DB.get('categories',[]);
    $('catsNav').innerHTML = cats.map(c =>
      '<button class="cat ' + (c.id === this.activeCat ? 'active' : '') + '" onclick="Store.setCat(\'' + c.id + '\')">' + c.icon + '<span>' + c.name + '</span></button>'
    ).join('');
  },

  setCat(id) { this.activeCat = id; this.renderCats(); this.renderProducts(); },

  filter() { this.searchQuery = $('searchInput').value.toLowerCase(); this.renderProducts(); },

  renderProducts() {
    let prods = DB.get('products',[]);
    if (this.activeCat !== 'all') prods = prods.filter(p => p.cat === this.activeCat);
    if (this.searchQuery) prods = prods.filter(p => p.name.toLowerCase().includes(this.searchQuery) || (p.desc||'').toLowerCase().includes(this.searchQuery));

    if (!prods.length) {
      $('productsGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>لا توجد منتجات مطابقة</p></div>';
      return;
    }

    const curr = (DB.get('settings',{}).currency || 'ر.س');
    $('productsGrid').innerHTML = prods.map(p => {
      const out = (p.stock || 0) <= 0;
      const badge = p.status === 'new' ? '<span class="badge new">جديد</span>' : p.status === 'offer' ? '<span class="badge offer">عرض</span>' : '';
      const outBadge = out ? '<span class="badge out">نفذ</span>' : '';
      const img = (p.images && p.images[0]) || svgImg(p.name.slice(0,15));
      return '<div class="card" onclick="Store.viewProduct(\'' + p.id + '\')">' +
        '<div class="card-img"><img src="' + img + '" loading="lazy" onerror="this.src=\'' + svgImg('?') + '\'">' + badge + outBadge + '</div>' +
        '<div class="card-info">' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-price"><span class="price-now">' + p.price + ' ' + curr + '</span>' + (p.oldPrice ? '<span class="price-old">' + p.oldPrice + '</span>' : '') + '</div>' +
        '<button class="card-btn" ' + (out ? 'disabled' : '') + ' onclick="event.stopPropagation();Store.add(\'' + p.id + '\')">' + (out ? 'غير متوفر' : '+ أضف للسلة') + '</button>' +
        '</div></div>';
    }).join('');
  },

  viewProduct(id) {
    const p = DB.get('products',[]).find(x => x.id === id);
    if (!p) return;
    const curr = (DB.get('settings',{}).currency || 'ر.س');
    this.currentImages = p.images && p.images.length ? p.images : [svgImg(p.name.slice(0,15))];
    this.currentImgIdx = 0;
    const out = (p.stock || 0) <= 0;

    let thumbsHtml = this.currentImages.length > 1 ? '<div class="gallery-thumbs">' +
      this.currentImages.map((img, i) => '<img src="' + img + '" class="gallery-thumb ' + (i===0?'active':'') + '" onclick="Store.switchImg(' + i + ',this)">').join('') +
      '</div>' : '';

    let videoHtml = p.video ? '<video controls style="width:100%;border-radius:12px;margin-bottom:14px;background:#000"><source src="' + p.video + '"></video>' : '';

    $('productModalBox').innerHTML =
      '<button class="close-x" onclick="Store.closeProduct()">✕</button>' +
      '<img src="' + this.currentImages[0] + '" id="mainImg" class="gallery-main" onerror="this.src=\'' + svgImg('?') + '\'">' +
      thumbsHtml + videoHtml +
      '<h2 class="product-title">' + p.name + '</h2>' +
      '<div class="card-price" style="margin-bottom:10px"><span class="price-now" style="font-size:22px">' + p.price + ' ' + curr + '</span>' + (p.oldPrice ? '<span class="price-old">' + p.oldPrice + ' ' + curr + '</span>' : '') + '</div>' +
      '<div class="product-meta"><span>⭐ ' + (p.rating || 4.5) + '</span><span>📦 المتوفر: ' + (p.stock || 0) + '</span></div>' +
      '<p class="product-desc">' + (p.desc || 'لا يوجد وصف') + '</p>' +
      '<button class="btn-full" ' + (out ? 'disabled' : '') + ' onclick="Store.add(\'' + p.id + '\');Store.closeProduct()">' + (out ? 'غير متوفر' : 'أضف إلى السلة') + '</button>';
    $('productModal').classList.add('open');
  },

  switchImg(idx, el) {
    this.currentImgIdx = idx;
    $('mainImg').src = this.currentImages[idx];
    document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  },

  closeProduct() { $('productModal').classList.remove('open'); },

  add(id) {
    const p = DB.get('products',[]).find(x => x.id === id);
    if (!p || p.stock <= 0) return toast('المنتج غير متوفر', 'err');
    const cart = DB.get('cart',[]);
    const item = cart.find(i => i.id === id);
    if (item) {
      if (item.qty + 1 > p.stock) return toast('الكمية المتوفرة: ' + p.stock, 'err');
      item.qty++;
    } else {
      cart.push({id, qty:1});
    }
    DB.set('cart', cart);
    this.updateBadge();
    toast('تمت الإضافة للسلة ✓', 'ok');
  },

  updateBadge() {
    const total = DB.get('cart',[]).reduce((s,i) => s + i.qty, 0);
    const b = $('cartBadge');
    if (b) b.textContent = total;
  },

  openCart() {
    const cart = DB.get('cart',[]);
    const prods = DB.get('products',[]);
    const curr = (DB.get('settings',{}).currency || 'ر.س');

    if (!cart.length) {
      $('cartBox').innerHTML = '<button class="close-x" onclick="Store.closeCart()">✕</button><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><p>سلتك فارغة</p><button class="btn-full" onclick="Store.closeCart();App.go(\'store\')">تسوق الآن</button></div>';
      $('cartModal').classList.add('open');
      return;
    }

    let total = 0;
    let html = '<button class="close-x" onclick="Store.closeCart()">✕</button><h2 class="product-title" style="margin-bottom:14px">🛒 سلة التسوق</h2>';

    cart.forEach(item => {
      const p = prods.find(x => x.id === item.id);
      if (!p) return;
      total += p.price * item.qty;
      html += '<div class="cart-item"><img src="' + ((p.images && p.images[0]) || svgImg(p.name.slice(0,15))) + '">' +
        '<div class="cart-item-info"><div class="cart-item-name">' + p.name + '</div>' +
        '<div class="cart-item-price">' + p.price + ' ' + curr + ' × ' + item.qty + ' = ' + (p.price * item.qty) + ' ' + curr + '</div>' +
        '<button class="cart-remove" onclick="Store.removeItem(\'' + p.id + '\')">× حذف</button></div>' +
        '<div class="qty" style="margin:0"><button onclick="Store.updateQty(\'' + p.id + '\',-1)">−</button><span>' + item.qty + '</span><button onclick="Store.updateQty(\'' + p.id + '\',1)">+</button></div>' +
        '</div>';
    });

    html += '<div class="cart-total"><span>الإجمالي</span><span>' + total + ' ' + curr + '</span></div>';
    html += '<button class="btn-full" onclick="Store.checkout(' + total + ')">إتمام الطلب →</button>';

    $('cartBox').innerHTML = html;
    $('cartModal').classList.add('open');
  },

  closeCart() { $('cartModal').classList.remove('open'); },

  updateQty(id, delta) {
    const cart = DB.get('cart',[]);
    const item = cart.find(i => i.id === id);
    const p = DB.get('products',[]).find(x => x.id === id);
    if (!item || !p) return;
    const newQty = item.qty + delta;
    if (newQty <= 0) { this.removeItem(id); return; }
    if (newQty > p.stock) return toast('الحد الأقصى ' + p.stock, 'err');
    item.qty = newQty;
    DB.set('cart', cart);
    this.updateBadge();
    this.openCart();
  },

  removeItem(id) {
    const cart = DB.get('cart',[]).filter(i => i.id !== id);
    DB.set('cart', cart);
    this.updateBadge();
    this.openCart();
  },

  checkout(total) {
    const user = DB.get('currentUser', null);
    if (!user) {
      this.closeCart();
      App.go('account');
      return toast('سجّل الدخول أولاً لإتمام الطلب', 'err');
    }
    const curr = (DB.get('settings',{}).currency || 'ر.س');
    App.showModal(
      '<button class="close-x" onclick="App.closeModal()">✕</button>' +
      '<h2 class="product-title" style="margin-bottom:14px">إتمام الطلب</h2>' +
      '<div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="coName" value="' + user.name + '"></div>' +
      '<div class="form-group"><label class="form-label">الهاتف</label><input class="form-input" id="coPhone" value="' + (user.phone||'') + '"></div>' +
      '<div class="form-group"><label class="form-label">العنوان</label><textarea class="form-input" id="coAddress" placeholder="المدينة، الحي، الشارع..."></textarea></div>' +
      '<div class="cart-total"><span>الإجمالي</span><span>' + total + ' ' + curr + '</span></div>' +
      '<button class="btn-full" onclick="Store.confirmOrder(' + total + ')">تأكيد الطلب ✓</button>'
    );
  },

  confirmOrder(total) {
    const name = $('coName').value.trim();
    const phone = $('coPhone').value.trim();
    const address = $('coAddress').value.trim();
    if (!name || !phone || !address) return toast('املأ كل الحقول', 'err');

    const cart = DB.get('cart',[]);
    const products = DB.get('products',[]);
    const orderItems = [];

    cart.forEach(item => {
      const p = products.find(x => x.id === item.id);
      if (p) {
        orderItems.push({id: p.id, name: p.name, price: p.price, qty: item.qty});
        p.stock = Math.max(0, (p.stock||0) - item.qty);
      }
    });

    DB.set('products', products);

    const orders = DB.get('orders',[]);
    const user = DB.get('currentUser', {});
    orders.unshift({
      id: 'ORD' + Date.now(),
      date: new Date().toISOString(),
      user: {name, phone, email: user.email, address},
      items: orderItems,
      total: total,
      status: 'جديد'
    });
    DB.set('orders', orders);
    DB.set('cart', []);
    this.updateBadge();
    this.closeCart();
    App.closeModal();
    toast('تم استلام طلبك بنجاح ✓', 'ok');
    setTimeout(() => App.go('account'), 1200);
  }
};

      '<div class="form-group"><label class="form-label">البريد الإلكتروني</label><input class="form-input" id="regEmail" type="email" placeholder="you@example.com"></div>' +

      '<button class="btn-outline" onclick="Accounts.render()">← رجوع</button>' +
      '</div>';
  },

  register() {
    const name = $('regName').value.trim();
    const email = $('regEmail').value.trim().toLowerCase();
    const phone = $('regPhone').value.trim();
    const pass = $('regPass').value;
    if (!name || !email || !pass) return toast('املأ الحقول المطلوبة', 'err');
    if (pass.length < 6) return toast('كلمة المرور 6 أحرف على الأقل', 'err');
    const users = DB.get('users', []);
    if (users.find(u => u.email === email)) return toast('البريد مسجل مسبقاً', 'err');
    const code = Math.floor(100000 + Math.random() * 900000);
    const user = {id: 'u' + Date.now(), name, email, phone, pass, verified: false, blocked: false, createdAt: Date.now(), otp: code};
    users.push(user);
    DB.set('users', users);
    // محاكاة OTP
    toast('📧 كود التحقق: ' + code, 'ok');
    setTimeout(() => {
      const input = prompt('أدخل كود التحقق المرسل (تجريبي - الكود في التنبيه)');
      if (input == code) {
        user.verified = true;
        DB.set('users', users);
        DB.set('currentUser', user);
        toast('تم التسجيل بنجاح ✓', 'ok');
        this.render();
      } else {

  login() {
    const email = $('loginEmail').value.trim().toLowerCase();
    const pass = $('loginPass').value;
    const users = DB.get('users', []);
    const user = users.find(u => u.email === email && u.pass === pass);
    if (!user) return toast('بيانات الدخول خاطئة', 'err');
    if (user.blocked) return toast('حسابك محظور', 'err');
    DB.set('currentUser', user);
    toast('مرحباً ' + user.name + ' ✓', 'ok');
    this.render();
  },

  renderProfile(user) {
    const orders = DB.get('orders',[]).filter(o => o.user.email === user.email);

      '<p style="text-align:center;color:var(--gray);font-size:12px;margin-bottom:16px">' + user.email + '</p>' +
      '<div style="background:rgba(82,125,112,0.1);border:1px solid var(--emerald);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--emerald);margin-bottom:16px">✓ حساب موثّق</div>' +
      '<h3 style="font-size:14px;color:var(--gold);margin-bottom:10px">طلباتي</h3>' +
      ordersHtml +
      '<button class="btn-full" style="margin-top:16px" onclick="App.go(\'store\')">تصفح المتجر</button>' +

      '</div>';
  }
};

// ==================== Studio (AI Image Editor) ====================
const Studio = {
  img: null,
  settings: { bright: 100, contrast: 100, sat: 100, rot: 0, bg: '#101722' },
  canvas: null, ctx: null,

  init() {
    this.canvas = $('studioCanvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    $('studioUpload').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => {
          this.img = im;
          $('studioEditor').style.display = 'grid';
          this.redraw();
        };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    };
    ['bright','contrast','sat','rot'].forEach(k => {
      const el = $('s' + k.charAt(0).toUpperCase() + k.slice(1));
      if (el) el.oninput = (e) => {
        this.settings[k] = +e.target.value;
        const label = $('v' + k.charAt(0).toUpperCase() + k.slice(1));
        if (label) label.textContent = e.target.value + (k==='rot'?'°':'%');
        this.redraw();
      };
    });
    document.querySelectorAll('.bg-swatch').forEach(sw => {
      sw.onclick = () => {
        document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        this.settings.bg = sw.dataset.bg;
        this.redraw();
      };
    });
  },

  redraw() {
    if (!this.img) return;
    const s = this.settings;
    const max = 500;
    const scale = Math.min(1, max / this.img.width);
    const w = this.img.width * scale, h = this.img.height * scale;
    const rad = s.rot * Math.PI / 180;
    const cw = Math.ceil(Math.abs(w*Math.cos(rad)) + Math.abs(h*Math.sin(rad)));
    const ch = Math.ceil(Math.abs(w*Math.sin(rad)) + Math.abs(h*Math.cos(rad)));
    this.canvas.width = cw; this.canvas.height = ch;
    this.ctx.fillStyle = s.bg;
    this.ctx.fillRect(0, 0, cw, ch);
    this.ctx.save();
    this.ctx.translate(cw/2, ch/2);
    this.ctx.rotate(rad);
    this.ctx.filter = 'brightness(' + s.bright + '%) contrast(' + s.contrast + '%) saturate(' + s.sat + '%)';
    this.ctx.drawImage(this.img, -w/2, -h/2, w, h);
    this.ctx.restore();
  },

  save() {
    if (!this.img) return toast('ارفع صورة أولاً', 'err');
    const dataUrl = this.canvas.toDataURL('image/jpeg', 0.9);
    navigator.clipboard && navigator.clipboard.writeText(dataUrl).catch(()=>{});
    App.showModal(
      '<button class="close-x" onclick="App.closeModal()">✕</button>' +
      '<h2 class="product-title" style="margin-bottom:14px">الصورة المحفوظة</h2>' +
      '<img src="' + dataUrl + '" style="width:100%;border-radius:12px;margin-bottom:14px">' +
      '<p style="color:var(--gray);font-size:12px;margin-bottom:14px">الصورة بصيغة base64. استخدم رابطها في المنتج، أو حمّلها من الزر أدناه.</p>' +
      '<a href="' + dataUrl + '" download="product-' + Date.now() + '.jpg" class="btn-full" style="display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--gold);color:var(--black)">تحميل الصورة ⬇</a>' +
      '<button class="btn-outline" onclick="App.closeModal()">إغلاق</button>'
    );
  }
};
