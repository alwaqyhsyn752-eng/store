<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOIR | متجر النخبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#101722;--navy:#1B2938;--gold:#C6A66A;--ivory:#F1EBDD;--emerald:#527D70;--gray:#A5ABB4;--line:rgba(198,166,106,0.18);--card:rgba(27,41,56,0.55)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0a1018;background-image:radial-gradient(circle at 50% 0%,#1B2938 0%,#101722 55%,#0a1018 100%);color:var(--ivory);direction:rtl;min-height:100vh;padding-bottom:90px;line-height:1.6}
img{max-width:100%;display:block} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit} input,textarea{font-family:inherit}
.header{position:sticky;top:0;z-index:100;background:rgba(16,23,34,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#b59559);display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--black)}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-name{font-size:18px;font-weight:900;color:var(--gold)}
.brand-tag{font-size:9px;color:var(--gray);letter-spacing:2px}
.hdr-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:11px;background:rgba(198,166,106,0.08);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);position:relative}
.icon-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--gold);color:var(--black);font-size:10px;font-weight:800;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.search input{width:100%;height:44px;background:rgba(16,23,34,0.7);border:1px solid var(--line);border-radius:11px;padding:0 14px;color:var(--ivory);font-size:14px}
.cats{padding:14px 16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;background:rgba(27,41,56,0.6);border:1px solid var(--line);border-radius:12px;margin-left:8px;font-size:12px;color:var(--gray);min-width:74px}
.cat.active{background:var(--gold);color:var(--black);border-color:var(--gold);font-weight:700}
.hero{margin:16px;border-radius:20px;overflow:hidden;position:relative;height:220px;border:1px solid var(--line)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to left,rgba(16,23,34,0.95) 0%,rgba(16,23,34,0.4) 60%,transparent 100%)}
.hero-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px}
.hero-tag{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:8px;font-weight:700}
.hero-title{font-size:28px;font-weight:900;margin-bottom:14px}
.hero-btn{background:var(--gold);color:var(--black);padding:11px 24px;border-radius:24px;font-weight:800;font-size:13px;width:fit-content}
.section-head{padding:24px 16px 14px;display:flex;align-items:center;gap:14px}
.section-head h2{font-size:19px;font-weight:800}
.section-head .line{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform 0.2s}
.card:active{transform:scale(0.98)}
.card-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--black)}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:800}
.badge.new{background:var(--ivory);color:var(--black)} .badge.offer{background:var(--emerald);color:var(--ivory)}
.card-info{padding:12px;display:flex;flex-direction:column;flex:1;gap:4px}
.card-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{display:flex;align-items:baseline;gap:6px;margin:2px 0 6px}
.price-now{color:var(--gold);font-size:15px;font-weight:800} .price-old{color:var(--gray);font-size:11px;text-decoration:line-through}
.card-btn{margin-top:auto;padding:9px;background:transparent;border:1px solid var(--gold);border-radius:9px;color:var(--gold);font-weight:700;font-size:12px}
.card-btn:active{background:var(--gold);color:var(--black)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,23,34,0.9);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--gray);padding:4px 16px}
.nav-item svg{width:22px;height:22px}
.nav-item.active{color:var(--gold);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:linear-gradient(180deg,var(--navy) 0%,var(--black) 100%);border-top:1px solid var(--gold);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px}
.close-x{margin-left:auto;width:36px;height:36px;background:rgba(198,166,106,0.1);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:18px;margin-bottom:8px}
.gallery-main{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;margin-bottom:10px}
.product-title{font-size:19px;font-weight:800;margin-bottom:6px}
.product-desc{font-size:13px;color:var(--gray);margin-bottom:14px;line-height:1.7}
.form-group{margin-bottom:14px} .form-label{display:block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:6px}
.form-input{width:100%;padding:12px 14px;background:rgba(16,23,34,0.7);border:1px solid var(--line);border-radius:10px;color:var(--ivory);font-size:14px}
.btn-full{width:100%;height:48px;background:var(--gold);color:var(--black);border-radius:12px;font-weight:800;font-size:14px}
.btn-outline{width:100%;height:46px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:12px;font-weight:700;font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--black);padding:12px 22px;border-radius:24px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:1000}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#e74c3c;color:#fff} .toast.ok{background:var(--emerald);color:#fff}
.cart-item{display:flex;gap:12px;align-items:center;background:rgba(27,41,56,0.5);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.cart-item img{width:68px;height:68px;border-radius:9px;object-fit:cover}
.cart-total{display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line);margin:14px 0;font-size:17px;font-weight:800;color:var(--gold)}
.page{display:none} .page.active{display:block}
.lock-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:380px;margin:40px auto;text-align:center}
.lock-icon{width:60px;height:60px;background:rgba(198,166,106,0.1);border-radius:16px;display:grid;place-items:center;margin:0 auto 14px;color:var(--gold)}
.lock-icon svg{width:28px;height:28px}
.row-item{display:flex;gap:10px;align-items:center;background:rgba(16,23,34,0.5);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
/* تنسيق التذييل النظيف */
.footer{text-align:center;padding:30px 16px 20px;margin-top:20px;border-top:1px solid var(--line)}
.footer-copyright{font-size:13px;color:var(--ivory);font-weight:700;margin-bottom:6px}
.footer-dev{font-size:11px;color:var(--gray);margin-bottom:14px}
.footer-phone{display:inline-flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-size:14px;font-weight:800;background:rgba(198,166,106,0.1);padding:10px 20px;border-radius:20px;border:1px solid rgba(198,166,106,0.3)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="page active" id="pageStore">
  <header class="header">
    <div class="header-top">
      <div class="brand" onclick="App.go('store')">
        <div class="brand-mark">N</div>
        <div class="brand-text"><span class="brand-name" id="brandName">NOIR</span><span class="brand-tag">PREMIUM MARKET</span></div>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn" onclick="Store.openCart()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cart-badge" id="cartBadge">0</span></button>
        <button class="icon-btn" onclick="App.go('account')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
      </div>
    </div>
    <div class="search"><input type="search" id="searchInput" placeholder="ابحث..." oninput="Store.filter()"></div>
  </header>
  <nav class="cats" id="catsNav"></nav>
  <section class="hero">
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=900&q=80" onerror="this.style.background='#1B2938'">
    <div class="hero-overlay"></div>
    <div class="hero-content"><div class="hero-tag">مجموعة 2025</div><h1 class="hero-title">أناقة لا تُضاهى</h1><button class="hero-btn" onclick="document.getElementById('productsGrid').scrollIntoView({behavior:'smooth'})">اكتشف الآن →</button></div>
  </section>
  <div class="section-head"><h2>المنتجات المميزة</h2><div class="line"></div></div>
  <div class="grid" id="productsGrid"><div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray)">جاري تحميل المنتجات...</div></div>
  
  <!-- التذييل النظيف -->
  <footer class="footer">
    <div class="footer-copyright">© 2024 NOIR. جميع الحقوق محفوظة.</div>
    <div class="footer-dev">تطوير: حسين غلاب الخلاقي</div>
    <div class="footer-phone" style="cursor:default">📞 738990668</div>
  </footer>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="App.go('store')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>المتجر</span></button>
    <button class="nav-item" onclick="Store.openCart()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>السلة</span></button>
    <button class="nav-item" onclick="App.go('account')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>حسابي</span></button>
  </nav>
</div>

<div class="page" id="pageAccount">
  <header class="header"><div class="header-top"><div class="brand"><div class="brand-mark">N</div><div class="brand-text"><span class="brand-name">حسابي</span></div></div><button class="icon-btn" onclick="App.go('store')">✕</button></div></header>
  <div id="accountContent" style="padding:16px"></div>
</div>

<div class="modal" id="productModal" onclick="if(event.target===this)Store.closeProduct()"><div class="modal-box" id="productModalBox"></div></div>
<div class="modal" id="cartModal" onclick="if(event.target===this)Store.closeCart()"><div class="modal-box" id="cartBox"></div></div>
<div class="modal" id="genericModal" onclick="if(event.target===this)App.closeModal()"><div class="modal-box" id="genericBox"></div></div>

<script>
const SUPABASE_URL = 'https://lihjllkvejczarfsqxxy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9fc0c5toY2CrschBTH2kug_-k5Qtp60';
const urlParams = new URLSearchParams(window.location.search);
const STORE_ID = urlParams.get('store') || localStorage.getItem('active_store') || 'default';
localStorage.setItem('active_store', STORE_ID);
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DB = {
  get: (k, def) => { try { const v = localStorage.getItem('noir_' + k); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set: (k, v) => { localStorage.setItem('noir_' + k, JSON.stringify(v)); }
};
const $ = id => document.getElementById(id);
function toast(msg,type){const t=$('toast');t.textContent=msg;t.className='toast show '+(type||'');clearTimeout(t._t);t._t=setTimeout(()=>{t.className='toast'},2800)}
function svgImg(txt){const s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#1B2938"/><text x="200" y="270" text-anchor="middle" font-family="Arial" font-size="22" fill="#C6A66A">'+txt+'</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}

const App = {
  go(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const el=$('page'+(page.charAt(0).toUpperCase()+page.slice(1)));if(el)el.classList.add('active');window.scrollTo(0,0);if(page==='account')Accounts.render();if(page==='store')Store.render();},
  closeModal(){$('genericModal').classList.remove('open')},
  showModal(html){$('genericBox').innerHTML=html;$('genericModal').classList.add('open')}
};

const Store = {
  activeCat:'all', searchQuery:'', allProducts:[],
  async render(){
    const { data: settings } = await supabaseClient.from('settings').select('*').eq('store_id',STORE_ID).limit(1);
    if(settings && settings[0]) $('brandName').textContent = settings[0].store_name;
    
    const { data: cats } = await supabaseClient.from('categories').select('*').eq('store_id',STORE_ID);
    this.renderCats(cats || [{id:'all',name:'الكل'}]);
    this.loadProducts();
    this.updateBadge();
  },
  renderCats(cats){
    if(!cats.find(c=>c.id==='all')) cats.unshift({id:'all',name:'الكل'});
    $('catsNav').innerHTML = cats.map(c=>'<button class="cat '+(c.id===this.activeCat?'active':'')+'" onclick="Store.setCat(\''+c.id+'\')"><span>'+c.name+'</span></button>').join('');
  },
  async loadProducts(){
    const { data, error } = await supabaseClient.from('products').select('*').eq('store_id',STORE_ID).order('created_at',{ascending:false});
    if(error) console.error(error);
    this.allProducts = data || [];
    this.renderProducts();
  },
  setCat(id){ this.activeCat=id; this.renderCats([{id:'all',name:'الكل'},...this.allProducts.map(p=>p.category_id)]); this.renderProducts(); },
  filter(){ this.searchQuery=$('searchInput').value.toLowerCase(); this.renderProducts(); },
  renderProducts(){
    let prods = this.allProducts;
    if(this.searchQuery) prods = prods.filter(p=>p.name.toLowerCase().includes(this.searchQuery));
    
    if(!prods.length){ $('productsGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--gray)">لا توجد منتجات</div>'; return; }
    
    $('productsGrid').innerHTML = prods.map(p => {
      const img = p.image_url || svgImg(p.name.slice(0,10));
      const badge = p.status==='new'?'<span class="badge new">جديد</span>':p.status==='offer'?'<span class="badge offer">عرض</span>':'';
      return '<div class="card" onclick="Store.viewProduct(\''+p.id+'\')"><div class="card-img"><img src="'+img+'">'+badge+'</div><div class="card-info"><div class="card-name">'+p.name+'</div><div class="card-price"><span class="price-now">'+p.price+' ر.س</span>'+(p.old_price?'<span class="price-old">'+p.old_price+'</span>':'')+'</div><button class="card-btn" onclick="event.stopPropagation();Store.add(\''+p.id+'\')">+ أضف</button></div></div>';
    }).join('');
  },
  viewProduct(id){
    const p = this.allProducts.find(x=>x.id===id); if(!p) return;
    const img = p.image_url || svgImg(p.name.slice(0,10));
    $('productModalBox').innerHTML = '<button class="close-x" onclick="Store.closeProduct()">✕</button><img src="'+img+'" class="gallery-main"><h2 class="product-title">'+p.name+'</h2><div class="card-price"><span class="price-now" style="font-size:22px">'+p.price+' ر.س</span>'+(p.old_price?'<span class="price-old">'+p.old_price+'</span>':'')+'</div><p class="product-desc">'+(p.description||'لا يوجد وصف')+'</p><button class="btn-full" onclick="Store.add(\''+p.id+'\');Store.closeProduct()">أضف إلى السلة</button>';
    $('productModal').classList.add('open');
  },
  closeProduct(){ $('productModal').classList.remove('open'); },
  add(id){
    const cart = DB.get('cart',[]); const item = cart.find(i=>i.id===id);
    if(item) item.qty++; else cart.push({id, qty:1});
    DB.set('cart', cart); this.updateBadge(); toast('تمت الإضافة ✓','ok');
  },
  updateBadge(){ $('cartBadge').textContent = DB.get('cart',[]).reduce((s,i)=>s+i.qty,0); },
  openCart(){
    const cart = DB.get('cart',[]);
    if(!cart.length){ $('cartBox').innerHTML='<button class="close-x" onclick="Store.closeCart()">✕</button><div style="text-align:center;padding:40px;color:var(--gray)">سلتك فارغة</div>'; $('cartModal').classList.add('open'); return; }
    let total = 0; let html = '<button class="close-x" onclick="Store.closeCart()">✕</button><h2 class="product-title">🛒 السلة</h2>';
    cart.forEach(item=>{ const p = this.allProducts.find(x=>x.id===item.id); if(!p) return; total += p.price * item.qty; html += '<div class="cart-item"><img src="'+(p.image_url||svgImg(p.name.slice(0,5)))+'"><div style="flex:1"><div style="font-weight:700;font-size:13px">'+p.name+'</div><div style="color:var(--gold);font-size:12px">'+p.price+' × '+item.qty+'</div></div><button onclick="Store.remove(\''+p.id+'\')" style="color:#e74c3c">حذف</button></div>'; });
    html += '<div class="cart-total"><span>الإجمالي</span><span>'+total+' ر.س</span></div><button class="btn-full" onclick="Store.checkout('+total+')">إتمام الطلب</button>';
    $('cartBox').innerHTML = html; $('cartModal').classList.add('open');
  },
  closeCart(){ $('cartModal').classList.remove('open'); },
  remove(id){ DB.set('cart', DB.get('cart',[]).filter(i=>i.id!==id)); this.updateBadge(); this.openCart(); },
  checkout(total){
    const user = DB.get('current_user', null);
    if(!user) { this.closeCart(); App.go('account'); return toast('سجل الدخول أولاً','err'); }
    App.showModal('<button class="close-x" onclick="App.closeModal()">✕</button><h2 class="product-title">إتمام الطلب</h2><div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="coName" value="'+user.name+'"></div><div class="form-group"><label class="form-label">الهاتف</label><input class="form-input" id="coPhone" value="'+user.phone+'"></div><div class="form-group"><label class="form-label">العنوان</label><textarea class="form-input" id="coAddress"></textarea></div><button class="btn-full" onclick="Store.confirmOrder('+total+')">تأكيد</button>');
  },
  async confirmOrder(total){
    const name = $('coName').value.trim(); const phone = $('coPhone').value.trim(); const address = $('coAddress').value.trim();
    if(!name || !phone || !address) return toast('املأ الحقول','err');
    
    let lat = null, lng = null;
    try { const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000})); lat=pos.coords.latitude; lng=pos.coords.longitude; } catch(e) {}
    
    const cart = DB.get('cart',[]);
    const { data: order, error } = await supabaseClient.from('orders').insert([{customer_name:name, phone, address, total, location_lat:lat, location_lng:lng, store_id:STORE_ID, status:'جديد'}]).select();
    if(!error && order){
      const items = cart.map(i=>{ const p=this.allProducts.find(x=>x.id===i.id); return {order_id:order[0].id, product_id:i.id, product_name:p.name, price:p.price, quantity:i.qty}; });
      await supabaseClient.from('order_items').insert(items);
    }
    
    DB.set('cart',[]); this.updateBadge(); this.closeCart(); App.closeModal(); toast('تم الطلب بنجاح ✓','ok');
  }
};

const Accounts = {
  render(){ const user = DB.get('current_user',null); if(user) this.profile(user); else this.login(); },
  login(){ $('accountContent').innerHTML = '<div class="lock-box"><div class="lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><h2 class="product-title" style="text-align:center">دخول</h2><div class="form-group"><input class="form-input" id="loginEmail" type="email" placeholder="البريد"></div><div class="form-group"><input class="form-input" id="loginPass" type="password" placeholder="كلمة المرور"></div><button class="btn-full" onclick="Accounts.doLogin()">دخول</button><button class="btn-outline" onclick="Accounts.register()">إنشاء حساب</button>
        <button onclick="db.supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}})" style="width:100%;height:46px;margin-top:10px;background:#fff;color:#333;border-radius:12px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          الدخول بحساب Google
        </button></div>'; },
  register(){ $('accountContent').innerHTML = '<div class="lock-box"><div class="lock-icon" style="color:var(--emerald)">+</div><h2 class="product-title" style="text-align:center">حساب جديد</h2><div class="form-group"><input class="form-input" id="regName" placeholder="الاسم الرباعي"></div><div class="form-group"><input class="form-input" id="regFamily" placeholder="لقب العائلة"></div><div class="form-group"><input class="form-input" id="regNeighborhood" placeholder="الحي / العصبة"></div><div class="form-group"><input class="form-input" id="regEmail" type="email" placeholder="البريد"></div><div class="form-group"><input class="form-input" id="regPhone" type="tel" placeholder="الهاتف (يبدأ بـ 7)"></div><div class="form-group"><input class="form-input" id="regPass" type="password" placeholder="كلمة المرور"></div><button class="btn-full" onclick="Accounts.doRegister()">إنشاء</button><button class="btn-outline" onclick="Accounts.render()">رجوع</button></div>'; },
  async doLogin(){
    const email = $('loginEmail').value.trim(); const pass = $('loginPass').value;
    const { data } = await supabaseClient.from('users').select('*').eq('email',email).eq('password',pass).eq('store_id',STORE_ID);
    if(data && data[0]){ DB.set('current_user', data[0]); toast('مرحباً '+data[0].full_name,'ok'); this.render(); } else { toast('بيانات خاطئة','err'); }
  },
  async doRegister(){
    const name = $('regName').value.trim(); const family = $('regFamily').value.trim(); const hood = $('regNeighborhood').value.trim();
    const email = $('regEmail').value.trim(); const phone = $('regPhone').value.trim(); const pass = $('regPass').value;
    if(!name || !email || !pass || !phone || !family || !hood) return toast('املأ كل الحقول','err');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('البريد غير صالح','err');
    if(!/^(?:\+967|0)?7[0-9]{8}$/.test(phone)) return toast('رقم الهاتف غير صالح','err');
    if(name.split(' ').filter(x=>x.length>1).length < 4) return toast('الاسم يجب أن يكون رباعياً','err');
    const { error } = await supabaseClient.from('users').insert([{email,phone,password:pass,full_name:name,family_name:family,neighborhood:hood,store_id:STORE_ID}]);
    if(error) { toast('البريد مسجل مسبقاً أو حدث خطأ','err'); return; }
    toast('تم التسجيل! سجل دخولك الآن','ok'); this.login();
  },
  profile(user){ $('accountContent').innerHTML = '<div class="lock-box"><div class="lock-icon" style="background:var(--gold);color:var(--black);font-weight:900">'+user.full_name.charAt(0)+'</div><h2 class="product-title" style="text-align:center">'+user.full_name+'</h2><p style="color:var(--gray);font-size:12px">'+user.email+'</p><button class="btn-full" style="margin-top:20px" onclick="App.go(\'store\')">تصفح المتجر</button><button class="btn-outline" onclick="DB.set(\'current_user\',null);Accounts.render()">خروج</button></div>'; }
};

document.addEventListener('DOMContentLoaded', () => Store.render());
window.App=App; window.Store=Store; window.Accounts=Accounts;
</script>
</body>
</html>
