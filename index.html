<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIR | متجر النخبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#101722;--navy:#1B2938;--gold:#C6A66A;--gold2:#b59559;--ivory:#F1EBDD;--emerald:#527D70;--gray:#A5ABB4;--line:rgba(198,166,106,0.18);--card:rgba(27,41,56,0.55)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0a1018;background-image:radial-gradient(circle at 50% 0%,#1B2938 0%,#101722 55%,#0a1018 100%);color:var(--ivory);direction:rtl;min-height:100vh;padding-bottom:80px;line-height:1.6}
img{max-width:100%;display:block} button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit} input,textarea{font-family:inherit}
.header{position:sticky;top:0;z-index:100;background:rgba(16,23,34,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:14px 16px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--black)}
.brand-name{font-size:16px;font-weight:800} .brand-tag{font-size:9px;color:var(--gold)}
.hdr-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:11px;background:rgba(198,166,106,0.08);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);position:relative}
.icon-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--gold);color:var(--black);font-size:10px;font-weight:800;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.search input{width:100%;height:44px;background:rgba(16,23,34,0.7);border:1px solid var(--line);border-radius:11px;padding:0 14px;color:var(--ivory);font-size:14px}
.cats{padding:14px 16px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;background:rgba(27,41,56,0.6);border:1px solid var(--line);border-radius:12px;margin-left:8px;font-size:12px;color:var(--gray)}
.cat.active{background:var(--gold);color:var(--black);font-weight:700}
.hero{margin:16px;border-radius:20px;overflow:hidden;position:relative;height:240px;border:1px solid var(--line)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to left,rgba(16,23,34,0.95) 0%,rgba(16,23,34,0.4) 60%,transparent 100%)}
.hero-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px}
.hero-tag{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:8px;font-weight:700}
.hero-title{font-size:30px;font-weight:900;margin-bottom:14px}
.hero-btn{background:var(--gold);color:var(--black);padding:11px 24px;border-radius:24px;font-weight:800;font-size:13px;width:fit-content}
.section-head{padding:24px 16px 14px;display:flex;align-items:center;gap:14px}
.section-head h2{font-size:19px;font-weight:800}
.section-head .line{flex:1;height:1px;background:linear-gradient(to left,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--black)}
.card-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:16px;font-size:10px;font-weight:800}
.badge.new{background:var(--ivory);color:var(--black)} .badge.offer{background:var(--emerald);color:var(--ivory)}
.card-info{padding:12px;display:flex;flex-direction:column;flex:1;gap:4px}
.card-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{display:flex;align-items:baseline;gap:6px;margin:2px 0 6px}
.price-now{color:var(--gold);font-size:15px;font-weight:800} .price-old{color:var(--gray);font-size:11px;text-decoration:line-through}
.card-btn{margin-top:auto;padding:9px;background:transparent;border:1px solid var(--gold);border-radius:9px;color:var(--gold);font-weight:700;font-size:12px}
.card-btn:hover{background:var(--gold);color:var(--black)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,23,34,0.9);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--gray);padding:4px 16px}
.nav-item svg{width:22px;height:22px}
.nav-item.active{color:var(--gold);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:linear-gradient(180deg,var(--navy) 0%,var(--black) 100%);border-top:1px solid var(--gold);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px}
.close-x{margin-left:auto;width:36px;height:36px;background:rgba(198,166,106,0.1);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:18px;margin-bottom:8px}
.gallery-main{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;margin-bottom:10px}
.product-title{font-size:19px;font-weight:800;margin-bottom:6px}
.product-desc{font-size:13px;color:var(--gray);margin-bottom:14px;line-height:1.7}
.form-group{margin-bottom:14px} .form-label{display:block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:6px}
.form-input{width:100%;padding:12px 14px;background:rgba(16,23,34,0.7);border:1px solid var(--line);border-radius:10px;color:var(--ivory);font-size:14px}
.btn-full{width:100%;height:48px;background:var(--gold);color:var(--black);border-radius:12px;font-weight:800;font-size:14px}
.btn-outline{width:100%;height:46px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:12px;font-weight:700;font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--black);padding:12px 22px;border-radius:24px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:1000}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#e74c3c;color:#fff} .toast.ok{background:var(--emerald);color:#fff}
.cart-item{display:flex;gap:12px;align-items:center;background:rgba(27,41,56,0.5);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.cart-item img{width:68px;height:68px;border-radius:9px;object-fit:cover}
.cart-total{display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line);margin:14px 0;font-size:17px;font-weight:800;color:var(--gold)}
.page{display:none} .page.active{display:block}
.lock-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;max-width:380px;margin:40px auto;text-align:center}
.lock-icon{width:60px;height:60px;background:rgba(198,166,106,0.1);border-radius:16px;display:grid;place-items:center;margin:0 auto 14px;color:var(--gold)}
.lock-icon svg{width:28px;height:28px}
.row-item{display:flex;gap:10px;align-items:center;background:rgba(16,23,34,0.5);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="page active" id="pageStore">
  <header class="header">
    <div class="header-top">
      <div class="brand" onclick="App.go('store')"><div class="brand-mark">N</div><div><span class="brand-name" id="brandName">NOIR</span><span class="brand-tag">Premium Market</span></div></div>
      <div class="hdr-actions">
        <button class="icon-btn" onclick="Store.openCart()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cart-badge" id="cartBadge">0</span></button>
        <button class="icon-btn" onclick="App.go('account')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
      </div>
    </div>
    <div class="search"><input type="search" id="searchInput" placeholder="ابحث عن الفخامة..." oninput="Store.filter()"></div>
  </header>
  <nav class="cats" id="catsNav"></nav>
  <section class="hero">
    <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=900&q=80" onerror="this.style.background='#1B2938'">
    <div class="hero-overlay"></div>
    <div class="hero-content"><div class="hero-tag">مجموعة 2025</div><h1 class="hero-title">أناقة لا تُضاهى</h1><button class="hero-btn" onclick="document.getElementById('productsGrid').scrollIntoView({behavior:'smooth'})">اكتشف الآن →</button></div>
  </section>
  <div class="section-head"><h2>المنتجات المميزة</h2><div class="line"></div></div>
  <div class="grid" id="productsGrid"></div>
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="App.go('store')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>المتجر</span></button>
    <button class="nav-item" onclick="Store.openCart()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>السلة</span></button>
    <button class="nav-item" onclick="App.go('account')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>حسابي</span></button>
  </nav>
</div>
<div class="page" id="pageAccount">
  <header class="header"><div class="header-top"><div class="brand"><div class="brand-mark">N</div><div><span class="brand-name">حسابي</span></div></div><button class="icon-btn" onclick="App.go('store')">✕</button></div></header>
  <div id="accountContent" style="padding:16px"></div>
</div>
<div class="modal" id="productModal" onclick="if(event.target===this)Store.closeProduct()"><div class="modal-box" id="productModalBox"></div></div>
<div class="modal" id="cartModal" onclick="if(event.target===this)Store.closeCart()"><div class="modal-box" id="cartBox"></div></div>
<div class="modal" id="genericModal" onclick="if(event.target===this)App.closeModal()"><div class="modal-box" id="genericBox"></div></div>
<script>
const DB={get(k,d){try{const v=localStorage.getItem('noir_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){localStorage.setItem('noir_'+k,JSON.stringify(v))},del(k){localStorage.removeItem('noir_'+k)}};
function svgImg(txt,bg,c){const s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="'+(bg||'#1B2938')+'"/><text x="200" y="270" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="'+(c||'#C6A66A')+'">'+txt+'</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
function seedIfEmpty(){if(!DB.get('products')){DB.set('products',[{id:'p1',name:'ساعة فاخرة كلاسيك',price:1299,oldPrice:1599,cat:'watches',stock:12,status:'offer',rating:4.9,desc:'ساعة سويسرية بسوار جلد إيطالي أصلي.',images:[svgImg('WATCH')]},{id:'p2',name:'عطر NOIR Signature',price:599,cat:'perfumes',stock:25,status:'new',rating:4.8,desc:'عطر شرقي فاخر بمزيج من العود والمسك.',images:[svgImg('PERFUME')]},{id:'p3',name:'حقيبة جلد فاخرة',price:899,oldPrice:1199,cat:'bags',stock:8,status:'offer',rating:4.7,desc:'حقيبة يد جلد طبيعي.',images:[svgImg('BAG')]}]);} if(!DB.get('categories')){DB.set('categories',[{id:'all',name:'الكل',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>'},{id:'watches',name:'ساعات',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="6"/></svg>'},{id:'perfumes',name:'عطور',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="9" width="10" height="12" rx="2"/></svg>'},{id:'bags',name:'حقائب',icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1.5 12H5.5L4 8z"/></svg>'}]);} if(!DB.get('settings')){DB.set('settings',{storeName:'NOIR',currency:'ر.س',adminPass:'1234'});}}
const $=id=>document.getElementById(id);
function toast(msg,type){const t=$('toast');t.textContent=msg;t.className='toast show '+(type||'');clearTimeout(t._t);t._t=setTimeout(()=>{t.className='toast'},2800)}
const App={go(page){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const el=$('page'+(page.charAt(0).toUpperCase()+page.slice(1)));if(el)el.classList.add('active');window.scrollTo(0,0);if(page==='account')Accounts.render();if(page==='store')Store.render();},closeModal(){$('genericModal').classList.remove('open')},showModal(html){$('genericBox').innerHTML=html;$('genericModal').classList.add('open')}};
const Store={activeCat:'all',searchQuery:'',render(){$('brandName').textContent=DB.get('settings',{}).storeName||'NOIR';this.renderCats();this.renderProducts();this.updateBadge()},renderCats(){const cats=DB.get('categories',[]);$('catsNav').innerHTML=cats.map(c=>'<button class="cat '+(c.id===this.activeCat?'active':'')+'" onclick="Store.setCat(\''+c.id+'\')">'+c.icon+'<span>'+c.name+'</span></button>').join('')},setCat(id){this.activeCat=id;this.renderCats();this.renderProducts()},filter(){this.searchQuery=$('searchInput').value.toLowerCase();this.renderProducts()},renderProducts(){let prods=DB.get('products',[]);if(this.activeCat!=='all')prods=prods.filter(p=>p.cat===this.activeCat);if(this.searchQuery)prods=prods.filter(p=>p.name.toLowerCase().includes(this.searchQuery));if(!prods.length){$('productsGrid').innerHTML='<p style="grid-column:1/-1;text-align:center;color:var(--gray)">لا توجد منتجات</p>';return}const curr=(DB.get('settings',{}).currency||'ر.س');$('productsGrid').innerHTML=prods.map(p=>{const out=(p.stock||0)<=0;const badge=p.status==='new'?'<span class="badge new">جديد</span>':p.status==='offer'?'<span class="badge offer">عرض</span>':'';const img=(p.images&&p.images[0])||svgImg(p.name.slice(0,15));return '<div class="card" onclick="Store.viewProduct(\''+p.id+'\')"><div class="card-img"><img src="'+img+'">'+badge+'</div><div class="card-info"><div class="card-name">'+p.name+'</div><div class="card-price"><span class="price-now">'+p.price+' '+curr+'</span>'+(p.oldPrice?'<span class="price-old">'+p.oldPrice+'</span>':'')+'</div><button class="card-btn" '+(out?'disabled':'')+' onclick="event.stopPropagation();Store.add(\''+p.id+'\')">'+(out?'غير متوفر':'+ أضف للسلة')+'</button></div></div>'}).join('')},viewProduct(id){const p=DB.get('products',[]).find(x=>x.id===id);if(!p)return;const curr=(DB.get('settings',{}).currency||'ر.س');this.currentImages=p.images&&p.images.length?p.images:[svgImg(p.name.slice(0,15))];this.currentImgIdx=0;const out=(p.stock||0)<=0;$('productModalBox').innerHTML='<button class="close-x" onclick="Store.closeProduct()">✕</button><img src="'+this.currentImages[0]+'" class="gallery-main"><h2 class="product-title">'+p.name+'</h2><div class="card-price"><span class="price-now" style="font-size:22px">'+p.price+' '+curr+'</span>'+(p.oldPrice?'<span class="price-old">'+p.oldPrice+'</span>':'')+'</div><p class="product-desc">'+(p.desc||'لا يوجد وصف')+'</p><button class="btn-full" '+(out?'disabled':'')+' onclick="Store.add(\''+p.id+'\');Store.closeProduct()">'+(out?'غير متوفر':'أضف إلى السلة')+'</button>';$('productModal').classList.add('open')},closeProduct(){$('productModal').classList.remove('open')},add(id){const p=DB.get('products',[]).find(x=>x.id===id);if(!p||p.stock<=0)return toast('غير متوفر','err');const cart=DB.get('cart',[]);const item=cart.find(i=>i.id===id);if(item){if(item.qty+1>p.stock)return toast('الكمية المتوفرة: '+p.stock,'err');item.qty++}else{cart.push({id,qty:1})}DB.set('cart',cart);this.updateBadge();toast('تمت الإضافة ✓','ok')},updateBadge(){const total=DB.get('cart',[]).reduce((s,i)=>s+i.qty,0);const b=$('cartBadge');if(b)b.textContent=total},openCart(){const cart=DB.get('cart',[]);const prods=DB.get('products',[]);const curr=(DB.get('settings',{}).currency||'ر.س');if(!cart.length){$('cartBox').innerHTML='<button class="close-x" onclick="Store.closeCart()">✕</button><div style="text-align:center;padding:40px"><p style="color:var(--gray);margin-bottom:16px">سلتك فارغة</p><button class="btn-full" onclick="Store.closeCart();App.go(\'store\')">تسوق الآن</button></div>';$('cartModal').classList.add('open');return}let total=0;let html='<button class="close-x" onclick="Store.closeCart()">✕</button><h2 class="product-title">🛒 السلة</h2>';cart.forEach(item=>{const p=prods.find(x=>x.id===item.id);if(!p)return;total+=p.price*item.qty;html+='<div class="cart-item"><img src="'+((p.images&&p.images[0])||svgImg(p.name.slice(0,10)))+'"><div style="flex:1"><div style="font-weight:700;font-size:13px">'+p.name+'</div><div style="color:var(--gold);font-size:12px">'+p.price+' '+curr+' × '+item.qty+'</div><button onclick="Store.removeItem(\''+p.id+'\')" style="color:#e74c3c;font-size:11px;margin-top:4px">× حذف</button></div></div>'});html+='<div class="cart-total"><span>الإجمالي</span><span>'+total+' '+curr+'</span></div><button class="btn-full" onclick="Store.checkout('+total+')">إتمام الطلب</button>';$('cartBox').innerHTML=html;$('cartModal').classList.add('open')},closeCart(){$('cartModal').classList.remove('open')},removeItem(id){const cart=DB.get('cart',[]).filter(i=>i.id!==id);DB.set('cart',cart);this.updateBadge();this.openCart()},checkout(total){const user=DB.get('currentUser',null);if(!user){this.closeCart();App.go('account');return toast('سجّل الدخول أولاً','err')}App.showModal('<button class="close-x" onclick="App.closeModal()">✕</button><h2 class="product-title">إتمام الطلب</h2><div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="coName" value="'+user.name+'"></div><div class="form-group"><label class="form-label">الهاتف</label><input class="form-input" id="coPhone" value="'+(user.phone||'')+'"></div><div class="form-group"><label class="form-label">العنوان</label><textarea class="form-input" id="coAddress"></textarea></div><button class="btn-full" onclick="Store.confirmOrder('+total+')">تأكيد ✓</button>')},confirmOrder(total){const name=$('coName').value.trim(),phone=$('coPhone').value.trim(),address=$('coAddress').value.trim();if(!name||!phone||!address)return toast('املأ الحقول','err');const cart=DB.get('cart',[]),products=DB.get('products',[]),orderItems=[];cart.forEach(item=>{const p=products.find(x=>x.id===item.id);if(p){orderItems.push({id:p.id,name:p.name,price:p.price,qty:item.qty});p.stock=Math.max(0,(p.stock||0)-item.qty)}});DB.set('products',products);const orders=DB.get('orders',[]),user=DB.get('currentUser',{});orders.unshift({id:'ORD'+Date.now(),date:new Date().toISOString(),user:{name,phone,email:user.email,address},items:orderItems,total:total,status:'جديد'});DB.set('orders',orders);DB.set('cart',[]);this.updateBadge();this.closeCart();App.closeModal();toast('تم استلام طلبك ✓','ok');setTimeout(()=>App.go('account'),1200)}};
const Accounts={render(){const user=DB.get('currentUser',null);if(user)return this.renderProfile(user);this.renderLogin()},renderLogin(){$('accountContent').innerHTML='<div class="lock-box"><div class="lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><h2 class="product-title" style="text-align:center">تسجيل الدخول</h2><div class="form-group"><input class="form-input" id="loginEmail" type="email" placeholder="البريد"></div><div class="form-group"><input class="form-input" id="loginPass" type="password" placeholder="كلمة المرور"></div><button class="btn-full" onclick="Accounts.login()">دخول</button><button class="btn-outline" onclick="Accounts.showRegister()">إنشاء حساب</button></div>'},showRegister(){$('accountContent').innerHTML='<div class="lock-box"><div class="lock-icon" style="background:rgba(82,125,112,0.1);color:var(--emerald)">+</div><h2 class="product-title" style="text-align:center">حساب جديد</h2><div class="form-group"><input class="form-input" id="regName" placeholder="الاسم"></div><div class="form-group"><input class="form-input" id="regEmail" type="email" placeholder="البريد"></div><div class="form-group"><input class="form-input" id="regPhone" type="tel" placeholder="الهاتف"></div><div class="form-group"><input class="form-input" id="regPass" type="password" placeholder="كلمة المرور"></div><button class="btn-full" onclick="Accounts.register()">إنشاء</button><button class="btn-outline" onclick="Accounts.render()">← رجوع</button></div>'},register(){const name=$('regName').value.trim(),email=$('regEmail').value.trim().toLowerCase(),phone=$('regPhone').value.trim(),pass=$('regPass').value;if(!name||!email||!pass)return toast('املأ الحقول','err');if(pass.length<6)return toast('كلمة المرور 6 أحرف','err');const users=DB.get('users',[]);if(users.find(u=>u.email===email))return toast('البريد مسجل','err');const code=Math.floor(100000+Math.random()*900000);const user={id:'u'+Date.now(),name,email,phone,pass,verified:false,blocked:false,createdAt:Date.now(),otp:code};users.push(user);DB.set('users',users);toast('📧 كود التحقق: '+code,'ok');setTimeout(()=>{const input=prompt('أدخل كود التحقق (تجريبي)');if(input==code){user.verified=true;DB.set('users',users);DB.set('currentUser',user);toast('تم التسجيل ✓','ok');this.render()}else toast('كود خاطئ','err')},500)},login(){const email=$('loginEmail').value.trim().toLowerCase(),pass=$('loginPass').value;const users=DB.get('users',[]);const user=users.find(u=>u.email===email&&u.pass===pass);if(!user)return toast('بيانات خاطئة','err');if(user.blocked)return toast('حسابك محظور','err');DB.set('currentUser',user);toast('مرحباً '+user.name,'ok');this.render()},logout(){DB.del('currentUser');toast('تم الخروج');this.render()},renderProfile(user){const orders=DB.get('orders',[]).filter(o=>o.user.email===user.email);let html=orders.length?orders.map(o=>'<div class="row-item"><div style="flex:1"><div style="font-weight:700;font-size:13px">'+o.id+'</div><div style="color:var(--gray);font-size:11px">'+new Date(o.date).toLocaleDateString('ar')+' • '+o.total+' ر.س</div><div style="color:var(--gold);font-size:11px;margin-top:4px">'+o.status+'</div></div></div>').join(''):'<p style="color:var(--gray);text-align:center;padding:20px">لا توجد طلبات</p>';$('accountContent').innerHTML='<div class="lock-box"><div class="lock-icon" style="background:var(--gold);color:var(--black);font-weight:900">'+user.name.charAt(0).toUpperCase()+'</div><h2 class="product-title" style="text-align:center">'+user.name+'</h2><p style="text-align:center;color:var(--gray);font-size:12px">'+user.email+'</p><h3 style="color:var(--gold);font-size:14px;margin:16px 0 8px">طلباتي</h3>'+html+'<button class="btn-full" style="margin-top:16px" onclick="App.go(\'store\')">تصفح المتجر</button><button class="btn-outline" onclick="Accounts.logout()">خروج</button></div>'}};
document.addEventListener('DOMContentLoaded',()=>{seedIfEmpty();Store.render()});
window.App=App;window.Store=Store;window.Accounts=Accounts;window.DB=DB;
